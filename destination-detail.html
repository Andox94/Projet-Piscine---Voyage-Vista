<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-top">

<div id="navbar-placeholder"></div>

<!-- DESTINATION HERO (sera rempli dynamiquement) -->
<div class="dest-hero" style="margin-top: 68px;">
  <img id="destHeroImg" src="" alt="Destination">
  <div class="dest-hero-overlay"></div>
  <div class="dest-hero-content container">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> <span class="breadcrumb-sep">/</span>
      <a href="destinations.html">Destinations</a> <span class="breadcrumb-sep">/</span>
      <span id="destName"></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap;">
      <div>
        <span class="badge badge-terra" id="destTag" style="margin-bottom: 10px;"></span>
        <h1 class="display-2" style="color: var(--white);" id="destTitle"></h1>
        <div style="display: flex; gap: 20px; margin-top: 10px; color: rgba(255,255,255,.75);" id="destMeta"></div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-ghost btn-sm" id="saveWishlistBtn" style="color: var(--white); border-color: rgba(255,255,255,.3);">♡ Sauvegarder</button>
        <button class="btn btn-primary" id="bookBtn">Réserver ce voyage</button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTENT (version simplifiée avec les infos dynamiques) -->
<div class="container" style="padding: 40px 24px;">
  <div style="display: grid; grid-template-columns: 1fr 360px; gap: 40px;">
    <div>
      <div class="tabs" id="detailTabs">
        <button class="tab-btn active" data-tab="overview">Vue d'ensemble</button>
        <button class="tab-btn" data-tab="practical">Infos pratiques</button>
      </div>
      <div class="tab-panel active" id="overview">
        <p id="destDescription" class="body-lg" style="margin-bottom: 24px;"></p>
        <h3 class="heading-3">Ce séjour comprend</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0;">
          <div style="display: flex; gap: 12px; background: var(--sand); padding: 14px; border-radius: var(--radius-md);">✈️ Vols aller-retour</div>
          <div style="display: flex; gap: 12px; background: var(--sand); padding: 14px; border-radius: var(--radius-md);">🏨 Hébergement 3 nuits</div>
          <div style="display: flex; gap: 12px; background: var(--sand); padding: 14px; border-radius: var(--radius-md);">🎭 Activités guidées</div>
          <div style="display: flex; gap: 12px; background: var(--sand); padding: 14px; border-radius: var(--radius-md);">🗺️ Guide numérique</div>
        </div>
      </div>
      <div class="tab-panel" id="practical">
        <p>Informations pratiques chargées depuis la base de données (à compléter selon vos besoins).</p>
      </div>
    </div>

    <!-- Booking card -->
    <div style="position: sticky; top: 88px;">
      <div style="background: var(--white); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-lg);">
        <div class="card-price" id="detailPrice" style="font-size: 2rem; text-align: center;">Dès 0 €</div>
        <div class="divider"></div>
        <a href="transports.html" class="btn btn-primary" style="width: 100%; justify-content: center;" id="detailBookBtn">Commencer la réservation →</a>
        <div class="secure-badge" style="margin-top: 12px;">🔒 Réservation sécurisée</div>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
// Récupération de l'ID dans l'URL
const urlParams = new URLSearchParams(window.location.search);
const destId = urlParams.get('id');

if (destId) {
  fetch(`destinations.php?id=${destId}`)
    .then(res => res.json())
    .then(dest => {
      // Remplir le hero
      document.getElementById('destHeroImg').src = dest.image_url || 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1600';
      document.getElementById('destName').innerText = dest.name;
      document.getElementById('destTag').innerText = dest.tag || 'Destination';
      document.getElementById('destTitle').innerHTML = `${dest.name}, ${dest.country || ''}`;
      document.getElementById('destDescription').innerText = dest.description;
      document.getElementById('detailPrice').innerHTML = `Dès ${dest.price} €`;
      if (dest.rating) {
        document.getElementById('destMeta').innerHTML = `<span>⭐ ${dest.rating} · ${dest.reviews || 0} avis</span><span>📍 ${dest.country || ''}</span>`;
      }
      // Gérer le bouton de réservation
      const bookBtn = document.getElementById('bookBtn');
      bookBtn.onclick = () => {
        Cart.setDestination(dest);
        Toast.show(`${dest.name} ajouté à votre panier`, 'success');
        window.location.href = 'transports.html';
      };
      const detailBookBtn = document.getElementById('detailBookBtn');
      if (detailBookBtn) {
        detailBookBtn.onclick = (e) => {
          e.preventDefault();
          Cart.setDestination(dest);
          Toast.show(`${dest.name} ajouté au panier`, 'success');
          window.location.href = 'transports.html';
        };
      }
    })
    .catch(err => console.error('Erreur chargement destination:', err));
} else {
  document.getElementById('destName').innerText = 'Destination inconnue';
}

// Initialisation des onglets
function initTabs() {
  const tabs = document.querySelector('#detailTabs');
  if (!tabs) return;
  tabs.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === target));
    });
  });
}
initTabs();
</script>
</body>
</html>
