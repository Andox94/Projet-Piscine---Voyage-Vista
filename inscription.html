<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-top auth-page" style="display: flex; min-height: 100vh;">

<div id="navbar-placeholder" style="position: fixed; width: 100%; z-index: 1000;"></div>

<div style="display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; margin-top: 68px;">
  <div class="auth-image" style="background: linear-gradient(135deg, var(--navy), var(--navy-light)); display: flex; align-items: center; justify-content: center;">
    <div class="auth-quote" style="text-align: center; padding: 40px;">
      <div style="font-size: 4rem;">✈️</div>
      <p>“Le voyage est l’unique passion qui consiste à être heureux en attendant de l’être.”</p>
      <div class="auth-quote-author">— Alexandre Dumas</div>
    </div>
  </div>
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <div class="auth-logo">Voyage<span>Vista</span></div>
      <h2 class="auth-title">Créer un compte</h2>
      <p class="auth-subtitle">Rejoignez l’aventure et planifiez vos séjours sur mesure.</p>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Nom complet</label>
          <input type="text" class="form-input" id="regName" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="regEmail" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" id="regPassword" required>
        </div>
        <div class="form-group">
          <label class="form-label">Rôle</label>
          <select class="form-input" id="regRole">
            <option value="client">Client (voyageur)</option>
            <option value="prestataire">Prestataire (proposer des offres)</option>
          </select>
        </div>
        <button type="submit" class="auth-submit">S’inscrire</button>
      </form>

      <div class="auth-divider">ou</div>
      <button class="social-btn" onclick="alert('Connexion sociale non implémentée dans la démo.')">🔑 Se connecter avec Google</button>

      <div class="auth-switch">
        Déjà un compte ? <a href="connexion.html">Se connecter</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const role = document.getElementById('regRole').value;

  const res = await fetch('register.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password, role })
  });
  const data = await res.json();
  if (data.status === 'success') {
    Toast.show('Compte créé ! Vous pouvez vous connecter.', 'success');
    setTimeout(() => window.location.href = 'connexion.html', 1500);
  } else {
    Toast.show(data.message || 'Erreur lors de l\'inscription', 'error');
  }
});
</script>
</body>
</html>
