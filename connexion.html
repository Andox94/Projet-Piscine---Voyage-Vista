<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-top auth-page" style="display: flex; min-height: 100vh;">

<div id="navbar-placeholder" style="position: fixed; width: 100%; z-index: 1000;"></div>

<div style="display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; margin-top: 68px;">
  <div class="auth-image" style="background: linear-gradient(135deg, var(--navy), var(--navy-light));">
    <div class="auth-quote" style="text-align: center; padding: 40px;">...</div>
  </div>
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <div class="auth-logo">Voyage<span>Vista</span></div>
      <h2 class="auth-title">Se connecter</h2>
      <form id="loginForm">
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="loginEmail" required></div>
        <div class="form-group"><label class="form-label">Mot de passe</label><input type="password" class="form-input" id="loginPassword" required></div>
        <button type="submit" class="auth-submit">Se connecter</button>
      </form>
      <div class="auth-switch">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const res = await fetch('login.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (data.status === 'success') {
    Toast.show('Connexion réussie !', 'success');
    setTimeout(() => window.location.href = 'index.html', 1000);
  } else {
    Toast.show(data.message, 'error');
  }
});
</script>
</body>
</html>
