<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hébergements — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="page-top">

<div id="navbar-placeholder"></div>

<div style="background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 40px 0 36px;">
  <div class="container" style="color: var(--white);">
    <p style="font-size: 0.8rem; color: rgba(255,255,255,.5); margin-bottom: 10px;"><a href="transports.html" style="color: rgba(255,255,255,.5);">← Transports</a></p>
    <h1 class="heading-1" style="color: var(--white);">Choisissez votre hébergement</h1>
  </div>
</div>

<div style="background: var(--sand); padding: 36px 0;">
  <div class="container">
    <!-- Barre d'étapes -->
    <div class="steps-bar" style="margin-bottom: 32px;">
      <div class="step done"><div class="step-num">✓</div><div class="step-info"><div class="step-label">Étape 1</div><div class="step-name">Destination</div></div></div>
      <div class="step done"><div class="step-num">✓</div><div class="step-info"><div class="step-label">Étape 2</div><div class="step-name">Transport</div></div></div>
      <div class="step active"><div class="step-num">3</div><div class="step-info"><div class="step-label">Étape 3</div><div class="step-name">Hébergement</div></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-info"><div class="step-label">Étape 4</div><div class="step-name">Activités</div></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-info"><div class="step-label">Étape 5</div><div class="step-name">Panier</div></div></div>
    </div>

    <div id="hebergements-app"></div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function HebergementsApp() {
  const [cart, setCart] = useState(null);
  const [accommodations, setAccommodations] = useState([]);
  const [selectedAccom, setSelectedAccom] = useState(null);

  useEffect(() => {
    const c = Cart.get();
    setCart(c);
    if (c.accommodation) setSelectedAccom(c.accommodation);
    if (c.destination) {
      fetch(`accommodations.php?dest_id=${c.destination.id}`)
        .then(res => res.json())
        .then(data => setAccommodations(data))
        .catch(err => console.error(err));
    }
  }, []);

  function handleSelect(accom) {
    Cart.setAccommodation(accom);
    setSelectedAccom(accom);
    Toast.show('Hébergement sélectionné', 'success');
    Cart.updateBadge();
  }

  if (!cart?.destination) {
    return <div className="empty-state">Sélectionnez d'abord une destination.</div>;
  }

  const nights = 3; // par défaut 3 nuits
  return (
    <div style={{display:'grid', gridTemplateColumns:'1fr 340px', gap:'32px', alignItems:'start'}}>
      <div>
        <div style={{background:'var(--white)', borderRadius:'var(--radius-lg)', padding:'16px 20px', marginBottom:'20px'}}>
          <span>📍 Destination : {cart.destination.name}, {cart.destination.country}</span>
        </div>
        <div className="dest-grid">
          {accommodations.map(accom => (
            <div key={accom.id} className={`accom-card ${selectedAccom?.id === accom.id ? 'selected' : ''}`} onClick={() => handleSelect(accom)}>
              <div className="accom-img"><img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400" alt={accom.name} /></div>
              <div className="accom-body">
                <div className="accom-type">{accom.type}</div>
                <div className="accom-name">{accom.name}</div>
                <div className="stars-row">{accom.stars}</div>
                <div className="accom-footer">
                  <div className="accom-price">{accom.price_per_night} € <span>/ nuit</span></div>
                  <div className="transport-select-btn">{selectedAccom?.id === accom.id ? '✓' : '+'}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{position:'sticky', top:'88px'}}>
        <div className="order-summary">
          <h3 className="summary-title">Récapitulatif</h3>
          <div className="summary-line"><span>📍 {cart.destination.name}</span><strong>{cart.destination.price} €</strong></div>
          {cart.transport && <div className="summary-line"><span>🚆 Transport</span><strong>{cart.transport.price} €</strong></div>}
          {selectedAccom ? (
            <div className="summary-line"><span>🏨 {selectedAccom.name} ({nights} nuits)</span><strong>{selectedAccom.price_per_night * nights} €</strong></div>
          ) : (
            <div className="summary-line" style={{fontStyle:'italic'}}><span>Hébergement non sélectionné</span><strong>—</strong></div>
          )}
          <div className="summary-divider"></div>
          <div className="summary-total">
            <span>Total provisoire</span>
            <span className="price">{(cart.destination.price || 0) + (cart.transport?.price || 0) + (selectedAccom ? selectedAccom.price_per_night * nights : 0)} €</span>
          </div>
          <a href="activites.html" className={`checkout-btn ${!selectedAccom ? 'disabled' : ''}`} style={!selectedAccom ? {opacity:0.5, pointerEvents:'none'} : {}}>
            Continuer : Activités →
          </a>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<HebergementsApp />, document.getElementById('hebergements-app'));
</script>
</body>
</html>
