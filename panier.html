<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon panier — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-top">

<div id="navbar-placeholder"></div>

<div style="background: var(--navy); padding: 40px 0;">
  <div class="container">
    <h1 class="heading-1" style="color: var(--white);">Mon panier de voyage</h1>
  </div>
</div>

<div class="container" style="padding: 40px 0;">
  <div id="cart-content"></div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
function renderCart() {
  const cart = Cart.get();
  const container = document.getElementById('cart-content');

  if (!cart.destination) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🛒</div><h3>Votre panier est vide</h3><a href="destinations.html" class="btn btn-primary">Choisir une destination</a></div>`;
    return;
  }

  const nights = 3;
  let total = cart.destination.price;
  let html = `<div class="cart-layout"><div class="cart-sections">`;

  // Destination
  html += `<div class="cart-section">
    <div class="cart-section-header"><h3>Destination</h3><button class="cart-item-remove" onclick="Cart.setDestination(null); renderCart();">🗑️</button></div>
    <div class="cart-item"><div class="cart-item-img"><img src="${cart.destination.image_url || 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=100'}" alt=""></div>
    <div class="cart-item-info"><div class="cart-item-name">${cart.destination.name}, ${cart.destination.country || ''}</div><div class="cart-item-detail">${cart.destination.description?.substring(0,80)}...</div></div>
    <div class="cart-item-price">${cart.destination.price} €</div></div></div>`;

  // Transport
  if (cart.transport) {
    total += cart.transport.price;
    html += `<div class="cart-section"><div class="cart-section-header"><h3>Transport</h3><button class="cart-item-remove" onclick="Cart.setTransport(null); renderCart();">🗑️</button></div>
    <div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${cart.transport.type} · ${cart.transport.company || ''}</div><div class="cart-item-detail">Départ ${cart.transport.dep_time || '?'} → Arrivée ${cart.transport.arr_time || '?'}</div></div>
    <div class="cart-item-price">${cart.transport.price} €</div></div></div>`;
  }

  // Hébergement
  if (cart.accommodation) {
    const accomTotal = cart.accommodation.price_per_night * nights;
    total += accomTotal;
    html += `<div class="cart-section"><div class="cart-section-header"><h3>Hébergement</h3><button class="cart-item-remove" onclick="Cart.setAccommodation(null); renderCart();">🗑️</button></div>
    <div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${cart.accommodation.name}</div><div class="cart-item-detail">${cart.accommodation.stars || ''} · ${cart.accommodation.type} · ${nights} nuits</div></div>
    <div class="cart-item-price">${accomTotal} €</div></div></div>`;
  }

  // Activités
  if (cart.activities && cart.activities.length > 0) {
    html += `<div class="cart-section"><div class="cart-section-header"><h3>Activités (${cart.activities.length})</h3></div>`;
    cart.activities.forEach(act => {
      total += act.price;
      html += `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${act.name}</div><div class="cart-item-detail">${act.duration || ''}</div></div>
      <div class="cart-item-price">${act.price} €</div><button class="cart-item-remove" onclick="Cart.toggleActivity(${JSON.stringify(act).replace(/"/g, '&quot;')}); renderCart();">🗑️</button></div>`;
    });
    html += `</div>`;
  }

  html += `</div>`; // fin cart-sections

  // Résumé + paiement
  html += `<div class="order-summary">
    <h3 class="summary-title">Récapitulatif</h3>
    <div class="summary-line"><span>Sous-total</span><strong>${total} €</strong></div>
    <div class="summary-divider"></div>
    <div class="summary-total"><span>Total</span><span class="price">${total} €</span></div>
    <button id="confirmBookingBtn" class="checkout-btn">✅ Confirmer ma réservation</button>
    <div class="secure-badge">🔒 Simulation de réservation</div>
  </div></div>`;

  container.innerHTML = html;

  document.getElementById('confirmBookingBtn')?.addEventListener('click', async () => {
    const user = await fetch('session.php').then(r => r.json()).catch(() => null);
    if (!user || !user.name) {
      Toast.show('Veuillez vous connecter pour valider votre voyage', 'warning');
      window.location.href = 'connexion.html';
      return;
    }
    const payload = {
      user_id: user.id || 1,
      destination_id: cart.destination.id,
      transport_id: cart.transport?.id || null,
      accommodation_id: cart.accommodation?.id || null,
      activities: cart.activities?.map(a => a.id) || [],
      total_price: total
    };
    const res = await fetch('save_trip.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.status === 'success') {
      Toast.show('Voyage enregistré ! Merci.', 'success');
      Cart.clear();
      renderCart();
    } else {
      Toast.show(data.message || 'Erreur', 'error');
    }
  });
}

renderCart();
</script>
</body>
</html>
