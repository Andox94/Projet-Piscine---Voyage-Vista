<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageVista - Full-Stack Client-Serveur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <div id="root" class="flex flex-col flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        const VoyageContext = createContext();

        function VoyageProvider({ children }) {
            const [role, setRole] = useState('client');
            const [cart, setCart] = useState({ destination: null, transport: null, accommodation: null, activities: [] });
            const [notifications, setNotifications] = useState([
                { id: 1, text: "Système connecté au serveur PHP local.", type: "info" }
            ]);

            const notify = (text, type = "info") => {
                setNotifications(prev => [{ id: Date.now(), text, type }, ...prev]);
            };

            const selectDestination = (dest) => {
                setCart({ destination: dest, transport: null, accommodation: null, activities: [] });
                notify(`Destination validée : ${dest.name}`, "success");
            };

            return (
                <VoyageContext.Provider value={{ role, setRole, cart, setCart, notifications, notify, selectDestination }}>
                    {children}
                </VoyageContext.Provider>
            );
        }

        const useVoyage = () => useContext(VoyageContext);

        // --- VUE CATALOGUE (FETCH DEPUIS PHP) ---
        function CatalogView({ setTab }) {
            const { selectDestination, cart } = useVoyage();
            const [destinations, setDestinations] = useState([]);

            useEffect(() => {
                fetch('api/destinations.php')
                    .then(res => res.json())
                    .then(data => setDestinations(data))
                    .catch(err => console.error("Erreur de chargement PHP:", err));
            }, []);

            return (
                <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-black text-gray-900">Explorez nos destinations (API MySQL)</h2>
                        <p class="text-gray-500">Ces cartes proviennent directement de votre base de données via PHP.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {destinations.map(d => (
                            <div key={d.id} class={`bg-white rounded-2xl overflow-hidden shadow-sm border-2 transition ${cart.destination?.id === d.id ? 'border-blue-600 ring-4 ring-blue-50' : 'border-transparent'}`}>
                                <img src={d.image_url} class="h-48 w-full object-cover" alt={d.name}/>
                                <div class="p-5">
                                    <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold uppercase">{d.tag}</span>
                                    <h3 class="text-xl font-bold mt-2">{d.name}</h3>
                                    <p class="text-gray-600 text-sm mt-1">{d.description}</p>
                                    <div class="flex justify-between items-center mt-6">
                                        <span class="text-lg font-black text-blue-600">Dès {d.price} €</span>
                                        <button onClick={() => selectDestination(d)} class={`px-4 py-2 rounded-xl text-sm font-bold ${cart.destination?.id === d.id ? 'bg-green-600 text-white' : 'bg-gray-900 text-white'}`}>
                                            {cart.destination?.id === d.id ? '✓ Sélectionné' : 'Choisir'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    {cart.destination && (
                        <div class="text-right mt-8"><button onClick={() => setTab('transport')} class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700">Étape suivante : Transports →</button></div>
                    )}
                </div>
            );
        }

        // --- VUE TRANSPORT (FETCH DEPUIS PHP FILTRÉ PAR DESTINATION) ---
        function TransportView({ setTab }) {
            const { cart, setCart, notify } = useVoyage();
            const [transports, setTransports] = useState([]);

            useEffect(() => {
                if (cart.destination) {
                    fetch(`api/transports.php?dest_id=${cart.destination.id}`)
                        .then(res => res.json())
                        .then(data => setTransports(data));
                }
            }, [cart.destination]);

            if (!cart.destination) return <div class="p-8 bg-yellow-50 text-yellow-800 rounded-xl border border-yellow-200">⚠️ Sélectionnez d'abord une destination.</div>;

            return (
                <div>
                    <h2 class="text-2xl font-black mb-6">Trajets disponibles vers {cart.destination.name}</h2>
                    <div class="space-y-4">
                        {transports.length === 0 ? <p class="text-gray-400">Aucun trajet trouvé pour cette destination.</p> : 
                        transports.map(t => (
                            <div key={t.id} class={`bg-white p-5 rounded-xl border-2 flex justify-between items-center ${cart.transport?.id === t.id ? 'border-blue-600 bg-blue-50/20' : 'border-gray-100'}`}>
                                <div>
                                    <h4 class="font-bold text-lg">{t.type}</h4>
                                    <p class="text-sm text-gray-500">Créneau : {t.time_window}</p>
                                    <span class="text-xs text-red-500 font-medium">{t.seats_left} places critiques</span>
                                </div>
                                <div class="text-right flex items-center gap-4">
                                    <span class="text-xl font-black text-gray-900">{t.price} €</span>
                                    <button onClick={() => { setCart(p => ({...p, transport: t})); notify(`Transport retenu`, "success"); }} class={`px-4 py-2 rounded-xl text-sm font-bold ${cart.transport?.id === t.id ? 'bg-green-600 text-white' : 'bg-gray-100'}`}>
                                        Choisir
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div class="text-right mt-8"><button onClick={() => setTab('accommodation')} class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-md">Hébergements →</button></div>
                </div>
            );
        }

        // --- VUE HÉBERGEMENT (FETCH DEPUIS PHP) ---
        function AccommodationView({ setTab }) {
            const { cart, setCart, notify } = useVoyage();
            const [hotels, setHotels] = useState([]);

            useEffect(() => {
                if (cart.destination) {
                    fetch(`api/accommodations.php?dest_id=${cart.destination.id}`)
                        .then(res => res.json())
                        .then(data => setHotels(data));
                }
            }, [cart.destination]);

            if (!cart.destination) return <div class="p-8 bg-yellow-50 text-yellow-800 rounded-xl">⚠️ Destination requise.</div>;

            return (
                <div>
                    <h2 class="text-2xl font-black mb-6">Logements à {cart.destination.name}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {hotels.map(h => (
                            <div key={h.id} class={`bg-white p-6 rounded-xl border-2 flex flex-col justify-between ${cart.accommodation?.id === h.id ? 'border-blue-600' : 'border-gray-100'}`}>
                                <div>
                                    <div class="flex justify-between text-xs text-gray-400 font-bold"><span>{h.type}</span><span>{h.stars}</span></div>
                                    <h3 class="text-lg font-bold mt-2">{h.name}</h3>
                                    <p class="text-2xl font-black text-blue-600 mt-4">{h.price_per_night} € <span class="text-xs text-gray-400 font-normal">/ nuit</span></p>
                                </div>
                                <button onClick={() => { setCart(p => ({...p, accommodation: h})); notify(`Chambre réservée`, "success"); }} class={`w-full mt-6 py-2 rounded-xl font-bold text-sm ${cart.accommodation?.id === h.id ? 'bg-green-600 text-white' : 'bg-gray-900 text-white'}`}>
                                    Sélectionner
                                </button>
                            </div>
                        ))}
                    </div>
                    <div class="text-right mt-8"><button onClick={() => setTab('cart')} class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-md">Mon Panier →</button></div>
                </div>
            );
        }

        // --- VUE PANIER & ENVOI AU BACKEND (POST TRANSACTIONNEL) ---
        function CartView() {
            const { cart, setCart, notify } = useVoyage();
            const [name, setName] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            const total = (cart.destination?.price || 0) + (cart.transport?.price || 0) + ((cart.accommodation?.price_per_night || 0) * 3);

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // Envoi des structures de données vers l'API PHP de traitement
                fetch('api/save_trip.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_name: name,
                        destination_id: cart.destination.id,
                        total_price: total
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        setSuccessMsg(data.message);
                        setCart({ destination: null, transport: null, accommodation: null, activities: [] });
                        notify("Commande traitée en BDD !", "success");
                    }
                });
            };

            if (successMsg) return (
                <div class="max-w-md mx-auto text-center py-12 bg-white rounded-2xl shadow-sm border border-green-200 p-6">
                    <div class="text-5xl mb-2">🚀</div>
                    <h3 class="text-xl font-black text-green-700">Succès Synchrone !</h3>
                    <p class="text-gray-600 text-sm mt-2">{successMsg}</p>
                </div>
            );

            if (!cart.destination) return <div class="text-center p-12 text-gray-400 bg-white rounded-xl border border-dashed">Votre panier est vide.</div>;

            return (
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-4">
                        <h2 class="text-2xl font-black">Récapitulatif de votre itinéraire dynamique</h2>
                        <div class="bg-white p-6 rounded-xl border space-y-3">
                            <div class="flex justify-between"><span>📍 Destination : {cart.destination.name}</span><span class="font-bold">{cart.destination.price} €</span></div>
                            {cart.transport && <div class="flex justify-between"><span>🚄 Aller/Retour : {cart.transport.type}</span><span class="font-bold">{cart.transport.price} €</span></div>}
                            {cart.accommodation && <div class="flex justify-between"><span>🏨 Logement : {cart.accommodation.name} (3 nuits)</span><span class="font-bold">{cart.accommodation.price_per_night * 3} €</span></div>}
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border shadow-sm">
                        <h3 class="text-lg font-bold mb-4">Finaliser l'enregistrement</h3>
                        <div class="flex justify-between font-black text-xl mb-4"><span>Total :</span><span class="text-blue-600">{total} €</span></div>
                        <form onSubmit={handleSubmit} class="space-y-3">
                            <input type="text" placeholder="Votre nom" value={name} onChange={e => setName(e.target.value)} required class="w-full border p-2 text-sm rounded-lg" />
                            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-bold shadow-md hover:bg-green-700">Enregistrer dans MySQL</button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COMPOSANT MAIN (LAYOUT ET ROUTAGE) ---
        function MainApp() {
            const [tab, setTab] = useState('catalog');
            const { role, setRole, cart, notifications } = useVoyage();

            return (
                <div class="flex flex-col flex-grow">
                    <header class="bg-blue-800 text-white shadow-md">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <h1 onClick={() => setTab('catalog')} class="text-xl font-black cursor-pointer">VoyageVista 🌍</h1>
                            <nav class="flex gap-2 text-xs font-bold">
                                <button onClick={() => setTab('catalog')} class={`px-3 py-2 rounded-lg ${tab === 'catalog' ? 'bg-white text-blue-800' : ''}`}>Destinations</button>
                                <button onClick={() => setTab('transport')} class={`px-3 py-2 rounded-lg ${tab === 'transport' ? 'bg-white text-blue-800' : ''}`}>Transports</button>
                                <button onClick={() => setTab('accommodation')} class={`px-3 py-2 rounded-lg ${tab === 'accommodation' ? 'bg-white text-blue-800' : ''}`}>Hébergements</button>
                            </nav>
                            <button onClick={() => setTab('cart')} class="bg-orange-500 px-4 py-2 rounded-xl text-xs font-black">
                                🛒 Mon Panier
                            </button>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto w-full px-4 py-8 flex-grow">
                        {tab === 'catalog' && <CatalogView setTab={setTab} />}
                        {tab === 'transport' && <TransportView setTab={setTab} />}
                        {tab === 'accommodation' && <AccommodationView setTab={setTab} />}
                        {tab === 'cart' && <CartView />}
                    </main>

                    <footer class="bg-gray-900 text-gray-500 text-center py-4 text-xs mt-auto">
                        <p>© 2026 VoyageVista — Architecture Full-Stack connectée MySQL</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<VoyageProvider><MainApp /></VoyageProvider>, document.getElementById('root'));
    </script>
</body>
</html>
