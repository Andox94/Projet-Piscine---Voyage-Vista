                    <label style={{display:'flex',alignItems:'center',gap:'.4rem',cursor:'pointer',fontSize:'.85rem',fontWeight:600}}>
                        <input type="checkbox" checked={availOnly} onChange={e => setAvailOnly(e.target.checked)} />
                        Disponibles seulement
                    </label>
                </div>
            </div>
            {loading ? <Loading /> : hotels.length === 0 ? (
                <div className="alert alert-warn">Aucun hébergement trouvé.</div>
            ) : (
                <div className="grid">
                    {hotels.map(h => (
                        <div key={h.id} className={`card ${cart.accommodation?.id === h.id ? 'selected' : ''}`}>
                            <img src={h.image_url} className="card-img" alt={h.name} loading="lazy" />
                            <div className="card-body">
                                <h3>{h.name} <span style={{fontSize:'.9rem'}}>{'⭐'.repeat(parseInt(h.stars))}</span></h3>
                                <p className="card-desc">
                                    <span className="tag" style={{marginBottom:'.5rem'}}>{h.type}</span><br />
                                    {h.amenities}
                                </p>
                                <div style={{display:'flex',gap:'.5rem',marginBottom:'.5rem',alignItems:'center'}}>
                                    <AvailBadge left={h.rooms_left} total={h.rooms_total} />
                                    {h.free_cancellation ? <span style={{fontSize:'.75rem',color:'var(--success)'}}>✓ Annulation gratuite</span> : null}
                                </div>
                                <div className="card-footer">
                                    <div className="price">{h.price_per_night} € <small>/nuit</small></div>
                                    <button
                                        disabled={h.rooms_left === 0}
                                        className={`btn btn-sm ${cart.accommodation?.id === h.id ? 'btn-success' : h.rooms_left === 0 ? 'btn-outline' : 'btn-gold'}`}
                                        onClick={() => setCart(p => ({ ...p, accommodation: h }))}>
                                        {h.rooms_left === 0 ? 'Complet' : cart.accommodation?.id === h.id ? '✓ Choisi' : 'Réserver'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   ACTIVITIES VIEW
═══════════════════════════════════════════════════════════ */
function ActivitiesView() {
    const { cart, toggleActivity } = useApp();
    const [activities, setActivities] = useState([]);
    const [loading, setLoading]       = useState(true);
    const [filterCat, setFilterCat]   = useState('');
    const [filterDiff, setFilterDiff] = useState('');

    useEffect(() => {
        if (!cart.destination) return;
        setLoading(true);
        const p = new URLSearchParams({ destination_id: cart.destination.id, travelers: cart.travelers });
        if (filterCat)  p.append('category', filterCat);
        if (filterDiff) p.append('difficulty', filterDiff);
        fetch(`api/activities.php?${p}`)
            .then(r => r.json()).then(d => { setActivities(d); setLoading(false); })
            .catch(() => setLoading(false));
    }, [cart.destination, filterCat, filterDiff, cart.travelers]);

    if (!cart.destination) return <div className="alert alert-warn">⚠️ Veuillez d'abord choisir une destination.</div>;

    const cats  = [...new Set(activities.map(a => a.category))];
    const diffs = ['Facile', 'Modéré', 'Difficile'];

    return (
        <div>
            <div className="section-head">
                <h2>Activités à {cart.destination.name}</h2>
                <p>{cart.activities.length} activité(s) sélectionnée(s).</p>
            </div>
            <div className="search-bar">
                <div className="form-group">
                    <label className="form-label">Catégorie</label>
                    <select className="form-control" value={filterCat} onChange={e => setFilterCat(e.target.value)}>
                        <option value="">Toutes</option>
                        {cats.map(c => <option key={c}>{c}</option>)}
                    </select>
                </div>
                <div className="form-group">
                    <label className="form-label">Difficulté</label>
                    <select className="form-control" value={filterDiff} onChange={e => setFilterDiff(e.target.value)}>
                        <option value="">Toutes</option>
                        {diffs.map(d => <option key={d}>{d}</option>)}
                    </select>
                </div>
            </div>
            {loading ? <Loading /> : (
                <div className="grid">
                    {activities.map(a => {
                        const sel = cart.activities.some(x => x.id === a.id);
                        return (
                            <div key={a.id} className={`card ${sel ? 'selected' : ''}`}>
                                <div className="card-body">
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                                        <span className="tag">{a.category}</span>
                                        {a.is_full && <span style={{background:'#f8d7da',color:'#721c24',padding:'.2rem .5rem',borderRadius:'10px',fontSize:'.7rem',fontWeight:700}}>COMPLET</span>}
                                    </div>
                                    <h3 style={{margin:'.5rem 0'}}>{a.name}</h3>
                                    <p className="card-desc">{a.description}</p>
                                    <div style={{fontSize:'.8rem',color:'var(--text-muted)',marginBottom:'.5rem',lineHeight:1.6}}>
                                        ⏱ {a.duration} · 🎯 {a.difficulty}<br />
                                        👥 {a.spots_left} place(s) restante(s) / {a.max_participants}<br />
                                        {a.includes && <span>✓ {a.includes}</span>}
                                    </div>
                                    <div className="card-footer">
                                        <span className="price">{a.price_per_person} € <small>/pers.</small></span>
                                        <button
                                            disabled={a.is_full && !sel}
                                            className={`btn btn-sm ${sel ? 'btn-danger' : a.is_full ? 'btn-outline' : 'btn-gold'}`}
                                            onClick={() => toggleActivity(a)}>
                                            {sel ? '✕ Retirer' : a.is_full ? 'Complet' : '+ Ajouter'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   CART & CHECKOUT VIEW
═══════════════════════════════════════════════════════════ */
function CartView() {
    const { cart, setCart, user } = useApp();
    const [clientName,  setClientName]  = useState(user?.name  || '');
    const [clientEmail, setClientEmail] = useState(user?.email || '');
    const [travelers,   setTravelers]   = useState(cart.travelers || 1);
    const [nights,      setNights]      = useState(cart.nights || 3);
    const [depDate,     setDepDate]     = useState(cart.departure_date || '');
    const [retDate,     setRetDate]     = useState(cart.return_date || '');
    const [payMethod,   setPayMethod]   = useState('carte');
    const [cardNum,     setCardNum]     = useState('');
    const [cardExp,     setCardExp]     = useState('');
    const [cardCvv,     setCardCvv]     = useState('');
    const [cardName,    setCardName]    = useState('');
    const [step,        setStep]        = useState(1); // 1=recap, 2=paiement
    const [success,     setSuccess]     = useState(null);
    const [error,       setError]       = useState('');
    const [loading,     setLoading]     = useState(false);

    const total = Number(cart.destination?.price || 0)
        + (Number(cart.transport?.price || 0) * travelers)
        + (Number(cart.accommodation?.price_per_night || 0) * nights)
        + cart.activities.reduce((s, a) => s + Number(a.price_per_person) * travelers, 0);

    const dateError = () => {
        if (!depDate || !retDate) return null;
        const d = new Date(depDate), r = new Date(retDate), today = new Date();
        today.setHours(0,0,0,0);
        if (d < today) return 'La date de départ doit être dans le futur.';
        if (r <= d)    return 'La date de retour doit être après le départ.';
        return null;
    };

    const removeItem = (type) => {
        if (type === 'transport')      setCart(p => ({ ...p, transport: null }));
        if (type === 'accommodation')  setCart(p => ({ ...p, accommodation: null }));
        if (type === 'destination')    setCart(p => ({ ...p, destination: null, transport: null, accommodation: null, activities: [] }));
    };
    const removeActivity = (id) => setCart(p => ({ ...p, activities: p.activities.filter(a => a.id !== id) }));

    const formatCard = (v) => v.replace(/\s/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19);

    const submit = (e) => {
        e.preventDefault();
        const de = dateError();
        if (de) { setError(de); return; }
        if (!cart.destination) { setError('Aucune destination sélectionnée.'); return; }
        if (payMethod === 'carte' && (cardNum.replace(/\s/g,'').length < 16 || !cardExp || !cardCvv)) {
            setError('Informations de carte incomplètes.');
            return;
        }
        setError(''); setLoading(true);
        apiFetch('api/save_trip.php', {
            method: 'POST',
            body: JSON.stringify({
                user_id:          user?.id || 2,
                destination_id:   cart.destination.id,
                transport_id:     cart.transport?.id || null,
                accommodation_id: cart.accommodation?.id || null,
                activities:       cart.activities.map(a => a.id),
                client_name:      clientName,
                client_email:     clientEmail,
                total_price:      total,
                nights,
                travelers,
                departure_date:   depDate,
                return_date:      retDate,
                payment_method:   payMethod,
            })
        }).then(d => {
            if (d.status === 'success') {
                setSuccess(d);
                setCart({ destination:null, transport:null, accommodation:null, activities:[], nights:3, travelers:1, departure_date:'', return_date:'' });
            } else {
                setError(d.message);
            }
        }).catch(() => setError('Erreur réseau.'))
          .finally(() => setLoading(false));
    };

    if (success) return (
        <div className="success-screen">
            <div className="success-icon">🎉</div>
            <h2>Réservation confirmée !</h2>
            <p className="text-muted">Votre voyage a été enregistré avec succès.</p>
            <div className="ref-code">{success.ref_code}</div>
            <p className="text-muted text-sm">Conservez ce code de référence pour vos démarches.</p>
            <button className="btn btn-gold" style={{marginTop:'1.5rem'}} onClick={() => setSuccess(null)}>
                ← Planifier un nouveau voyage
            </button>
        </div>
    );

    if (!cart.destination) return (
        <div style={{textAlign:'center',padding:'3rem'}}>
            <p style={{fontSize:'2rem'}}>🛒</p>
            <h3 style={{marginBottom:'.5rem'}}>Votre panier est vide</h3>
            <p className="text-muted">Commencez par choisir une destination !</p>
        </div>
    );

    const dErr = dateError();

    return (
        <div>
            <div className="section-head">
                <h2>Panier & Réservation</h2>
            </div>
            {step === 1 && (
                <div className="cart-layout">
                    {/* ── RECAP ── */}
                    <div>
                        <div className="cart-summary">
                            <h3 style={{marginBottom:'1rem',fontFamily:'Playfair Display,serif'}}>Récapitulatif</h3>

                            <div className="cart-row">
                                <div>
                                    <strong>🌍 {cart.destination.name}, {cart.destination.country}</strong>
                                    <div className="text-muted text-sm">{cart.destination.tag}</div>
                                </div>
                                <div style={{display:'flex',gap:'.5rem',alignItems:'center'}}>
                                    <span>{cart.destination.price} €</span>
                                    <button className="btn btn-sm" style={{color:'var(--danger)',background:'transparent',padding:'.1rem .3rem'}} onClick={() => removeItem('destination')}>✕</button>
                                </div>
                            </div>

                            {cart.transport && (
                                <div className="cart-row">
                                    <div>
                                        <strong>✈️ {cart.transport.type} — {cart.transport.company}</strong>
                                        <div className="text-muted text-sm">{cart.transport.class} · {travelers} pers.</div>
                                    </div>
                                    <div style={{display:'flex',gap:'.5rem',alignItems:'center'}}>
                                        <span>{cart.transport.price * travelers} €</span>
                                        <button className="btn btn-sm" style={{color:'var(--danger)',background:'transparent',padding:'.1rem .3rem'}} onClick={() => removeItem('transport')}>✕</button>
                                    </div>
                                </div>
                            )}

                            {cart.accommodation && (
                                <div className="cart-row">
                                    <div>
                                        <strong>🏨 {cart.accommodation.name}</strong>
                                        <div className="text-muted text-sm">{nights} nuits · {cart.accommodation.type}</div>
                                    </div>
                                    <div style={{display:'flex',gap:'.5rem',alignItems:'center'}}>
                                        <span>{cart.accommodation.price_per_night * nights} €</span>
                                        <button className="btn btn-sm" style={{color:'var(--danger)',background:'transparent',padding:'.1rem .3rem'}} onClick={() => removeItem('accommodation')}>✕</button>
                                    </div>
                                </div>
                            )}

                            {cart.activities.map(a => (
                                <div key={a.id} className="cart-row">
                                    <div>
                                        <strong>🎯 {a.name}</strong>
                                        <div className="text-muted text-sm">{travelers} pers. × {a.price_per_person} €</div>
                                    </div>
                                    <div style={{display:'flex',gap:'.5rem',alignItems:'center'}}>
                                        <span>{a.price_per_person * travelers} €</span>
                                        <button className="btn btn-sm" style={{color:'var(--danger)',background:'transparent',padding:'.1rem .3rem'}} onClick={() => removeActivity(a.id)}>✕</button>
                                    </div>
                                </div>
                            ))}

                            <div className="cart-row cart-total">
                                <span>Total estimé</span>
                                <span>{total} €</span>
                            </div>
                        </div>

                        {/* Paramètres du séjour */}
                        <div className="cart-summary" style={{marginTop:'1rem'}}>
                            <h4 style={{marginBottom:'1rem'}}>Paramètres du séjour</h4>
                            <div className="form-row">
                                <div className="form-group">
                                    <label className="form-label">Voyageurs</label>
                                    <input type="number" className="form-control" min="1" max="20" value={travelers}
                                        onChange={e => { setTravelers(parseInt(e.target.value)||1); setCart(p => ({...p, travelers: parseInt(e.target.value)||1})); }} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Nuits</label>
                                    <input type="number" className="form-control" min="1" max="30" value={nights}
                                        onChange={e => { setNights(parseInt(e.target.value)||1); setCart(p => ({...p, nights: parseInt(e.target.value)||1})); }} />
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group">
                                    <label className="form-label">Départ</label>
                                    <input type="date" className="form-control" value={depDate}
                                        min={new Date().toISOString().split('T')[0]}
                                        onChange={e => { setDepDate(e.target.value); setCart(p => ({...p, departure_date: e.target.value})); }} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Retour</label>
                                    <input type="date" className="form-control" value={retDate}
                                        min={depDate || new Date().toISOString().split('T')[0]}
                                        onChange={e => { setRetDate(e.target.value); setCart(p => ({...p, return_date: e.target.value})); }} />
                                </div>
                            </div>
                            {dErr && <div className="alert alert-danger">{dErr}</div>}
                        </div>
                    </div>

                    {/* ── PANNEAU LATÉRAL ── */}
                    <div className="checkout-panel">
                        <h3>Vos informations</h3>
                        <div className="form-group">
                            <label className="form-label">Prénom et Nom</label>
                            <input className="form-control" value={clientName} onChange={e => setClientName(e.target.value)} required placeholder="Marie Dupont" />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Email</label>
                            <input type="email" className="form-control" value={clientEmail} onChange={e => setClientEmail(e.target.value)} required placeholder="vous@email.com" />
                        </div>
                        <hr className="divider" />
                        <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:'1.2rem',marginBottom:'1.5rem',color:'var(--navy)'}}>
                            <span>Total :</span><span>{total} €</span>
                        </div>
                        {error && <div className="alert alert-danger" style={{marginBottom:'1rem'}}>{error}</div>}
                        <button className="btn btn-gold btn-full"
                            disabled={!clientName || !clientEmail || !!dErr}
                            onClick={() => setStep(2)}>
                            Procéder au paiement →
                        </button>
                    </div>
                </div>
            )}

            {step === 2 && (
                <div className="cart-layout">
                    <div>
                        <div className="cart-summary">
                            <button className="btn btn-outline btn-sm" onClick={() => setStep(1)} style={{marginBottom:'1rem'}}>← Retour</button>
                            <h3 style={{marginBottom:'1.25rem',fontFamily:'Playfair Display,serif'}}>💳 Paiement</h3>

                            <div className="form-group">
                                <label className="form-label">Mode de paiement</label>
                                <select className="form-control" value={payMethod} onChange={e => setPayMethod(e.target.value)}>
                                    <option value="carte">Carte bancaire</option>
                                    <option value="paypal">PayPal</option>
                                    <option value="virement">Virement bancaire</option>
                                </select>
                            </div>

                            {payMethod === 'carte' && (
                                <>
                                    <div className="payment-card-preview">
                                        <div style={{fontSize:'.75rem',opacity:.7,marginBottom:'.25rem'}}>CARTE BANCAIRE</div>
                                        <div className="cc-number">{cardNum || '•••• •••• •••• ••••'}</div>
                                        <div className="cc-meta">
                                            <span>{cardName || 'VOTRE NOM'}</span>
                                            <span>{cardExp || 'MM/YY'}</span>
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Numéro de carte</label>
                                        <input className="form-control" value={cardNum} maxLength={19}
                                            onChange={e => setCardNum(formatCard(e.target.value))} placeholder="1234 5678 9012 3456" />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Nom sur la carte</label>
                                        <input className="form-control" value={cardName}
                                            onChange={e => setCardName(e.target.value.toUpperCase())} placeholder="MARIE DUPONT" />
                                    </div>
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label className="form-label">Expiration</label>
                                            <input className="form-control" value={cardExp} maxLength={5}
                                                onChange={e => {
                                                    let v = e.target.value.replace(/\D/g,'');
                                                    if (v.length >= 2) v = v.slice(0,2) + '/' + v.slice(2);
                                                    setCardExp(v.slice(0,5));
                                                }} placeholder="MM/YY" />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">CVV</label>
                                            <input className="form-control" value={cardCvv} maxLength={3}
                                                onChange={e => setCardCvv(e.target.value.replace(/\D/g,'').slice(0,3))} placeholder="123" type="password" />
                                        </div>
                                    </div>
                                </>
                            )}

                            {payMethod === 'paypal' && (
                                <div className="alert alert-info" style={{textAlign:'center',padding:'2rem'}}>
                                    <p style={{fontSize:'1.5rem'}}>🅿️</p>
                                    <p style={{fontWeight:600,marginTop:'.5rem'}}>Vous serez redirigé vers PayPal</p>
                                    <p className="text-muted text-sm">pour finaliser le paiement de {total} €.</p>
                                </div>
                            )}

                            {payMethod === 'virement' && (
                                <div className="alert alert-info">
                                    <p><strong>IBAN :</strong> FR76 3000 4008 0900 0000 0123 456</p>
                                    <p><strong>BIC :</strong> BNPAFRPPXXX</p>
                                    <p className="text-sm text-muted" style={{marginTop:'.5rem'}}>Référence : {clientName.split(' ').join('')}-VV</p>
                                </div>
                            )}

                            {error && <div className="alert alert-danger">{error}</div>}
                        </div>
                    </div>

                    <div className="checkout-panel">
                        <h3>Récapitulatif</h3>
                        <div style={{fontSize:'.85rem',color:'var(--text-muted)',marginBottom:'1rem',lineHeight:1.8}}>
                            <div>🌍 {cart.destination.name}</div>
                            {cart.transport      && <div>✈️ {cart.transport.company}</div>}
                            {cart.accommodation  && <div>🏨 {cart.accommodation.name}</div>}
                            {cart.activities.length > 0 && <div>🎯 {cart.activities.length} activité(s)</div>}
                            <div>👥 {travelers} voyageur(s) · 🌙 {nights} nuits</div>
                        </div>
                        <hr className="divider" />
                        <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:'1.3rem',marginBottom:'1.5rem',color:'var(--navy)'}}>
                            <span>Total :</span><span>{total} €</span>
                        </div>
                        <p className="text-sm text-muted" style={{marginBottom:'1rem'}}>
                            👤 {clientName} · {clientEmail}
                        </p>
                        <button className="btn btn-gold btn-full" onClick={submit} disabled={loading}>
                            {loading ? '⏳ Traitement…' : `✓ Confirmer — ${total} €`}
                        </button>
                        <p className="text-muted text-sm" style={{marginTop:'.75rem',textAlign:'center'}}>
                            🔒 Paiement simulé — données non transmises
                        </p>
                    </div>
                </div>
            )}
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   MY TRIPS VIEW
═══════════════════════════════════════════════════════════ */
function TripsView() {
    const { user } = useApp();
    const [trips, setTrips]   = useState([]);
    const [loading, setLoading] = useState(true);
    const [editing, setEditing] = useState(null);
    const [editTravelers, setEditTravelers] = useState(1);
    const [editNotes, setEditNotes]         = useState('');
    const [msg, setMsg]       = useState('');

    const load = () => {
        setLoading(true);
        fetch(`api/trips.php?user_id=${user.id}`)
            .then(r => r.json()).then(d => { setTrips(d); setLoading(false); })
            .catch(() => setLoading(false));
    };

    useEffect(() => { load(); }, []);

    const cancel = (trip_id) => {
        if (!confirm('Annuler ce voyage ?')) return;
        apiFetch('api/trips.php', { method: 'POST', body: JSON.stringify({ action: 'cancel', trip_id, user_id: user.id }) })
            .then(d => { setMsg(d.message); load(); });
    };

    const saveEdit = (trip_id) => {
        apiFetch('api/trips.php', { method: 'POST', body: JSON.stringify({ action: 'update', trip_id, user_id: user.id, travelers: editTravelers, notes: editNotes }) })
            .then(d => { setMsg(d.message); setEditing(null); load(); });
    };

    const del = (trip_id) => {
        if (!confirm('Supprimer définitivement cet itinéraire ?')) return;
        apiFetch('api/trips.php', { method: 'POST', body: JSON.stringify({ action: 'delete', trip_id, user_id: user.id }) })
            .then(d => { setMsg(d.message); load(); });
    };

    if (!user) return <div className="alert alert-warn">Connectez-vous pour voir vos voyages.</div>;

    return (
        <div>
            <div className="section-head">
                <h2>Mes Voyages</h2>
                <p>Historique et gestion de vos réservations.</p>
            </div>
            {msg && <div className="alert alert-success">{msg} <button style={{float:'right',background:'none',border:'none',cursor:'pointer'}} onClick={() => setMsg('')}>✕</button></div>}
            {loading ? <Loading /> : trips.length === 0 ? (
                <div style={{textAlign:'center',padding:'3rem',color:'var(--text-muted)'}}>
                    <p style={{fontSize:'2rem'}}>🗺️</p>
                    <p>Aucun voyage pour l'instant.</p>
                </div>
            ) : trips.map(t => (
                <div key={t.id} className="trip-card">
                    {t.destination_image && <img className="trip-img" src={t.destination_image} alt={t.destination_name} />}
                    <div style={{flex:1}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'.5rem'}}>
                            <div>
                                <h4 style={{marginBottom:'.2rem'}}>{t.destination_name}, {t.country}</h4>
                                <div className="text-muted text-sm">
                                    Réf. <strong>{t.reference_code}</strong> · {t.travelers} voyageur(s) · {t.nights} nuit(s)
                                </div>
                                {t.departure_date && <div className="text-muted text-sm">📅 {t.departure_date} → {t.return_date}</div>}
                                {t.transport_type && <div className="text-sm" style={{marginTop:'.2rem'}}>✈️ {t.transport_type} — {t.transport_company}</div>}
                                {t.accommodation_name && <div className="text-sm">🏨 {t.accommodation_name}</div>}
                                {t.activities.length > 0 && (
                                    <div className="text-sm text-muted">🎯 {t.activities.map(a => a.name).join(', ')}</div>
                                )}
                            </div>
                            <div style={{textAlign:'right'}}>
                                <span className={`status-pill status-${t.status}`}>{t.status === 'confirmed' ? 'Confirmé' : t.status === 'cancelled' ? 'Annulé' : 'En attente'}</span>
                                <div className="price" style={{marginTop:'.4rem',fontSize:'1.1rem'}}>{t.total_price} €</div>
                            </div>
                        </div>

                        {editing === t.id ? (
                            <div style={{marginTop:'1rem',background:'var(--ivory)',padding:'1rem',borderRadius:'8px'}}>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Voyageurs</label>
                                        <input type="number" className="form-control" min="1" max="20" value={editTravelers} onChange={e => setEditTravelers(parseInt(e.target.value)||1)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Notes</label>
                                        <input className="form-control" value={editNotes} onChange={e => setEditNotes(e.target.value)} placeholder="Notes optionnelles…" />
                                    </div>
                                </div>
                                <div style={{display:'flex',gap:'.5rem'}}>
                                    <button className="btn btn-gold btn-sm" onClick={() => saveEdit(t.id)}>✓ Sauvegarder</button>
                                    <button className="btn btn-outline btn-sm" onClick={() => setEditing(null)}>Annuler</button>
                                </div>
                            </div>
                        ) : (
                            <div style={{display:'flex',gap:'.5rem',marginTop:'.75rem',flexWrap:'wrap'}}>
                                {t.status === 'confirmed' && (
                                    <>
                                        <button className="btn btn-outline btn-sm" onClick={() => { setEditing(t.id); setEditTravelers(t.travelers); setEditNotes(t.notes||''); }}>✏️ Modifier</button>
                                        <button className="btn btn-sm" style={{background:'#fff3cd',color:'#856404'}} onClick={() => cancel(t.id)}>✕ Annuler</button>
                                    </>
                                )}
                                <button className="btn btn-danger btn-sm" onClick={() => del(t.id)}>🗑 Supprimer</button>
                            </div>
                        )}
                    </div>
                </div>
            ))}
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   PROFILE VIEW
═══════════════════════════════════════════════════════════ */
function ProfileView() {
    const { user, setUser } = useApp();
    const [form, setForm]   = useState({ name: user?.name||'', phone: user?.phone||'', bio: user?.bio||'', password: '' });
    const [msg, setMsg]     = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    const set = (k, v) => setForm(p => ({ ...p, [k]: v }));

    const save = (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        apiFetch(`api/auth.php?action=update`, { method: 'POST', body: JSON.stringify({ ...form, id: user.id }) })
            .then(d => {
                if (d.status === 'success') { setUser(d.user); setMsg('Profil mis à jour !'); }
                else setError(d.message);
            }).catch(() => setError('Erreur réseau.'))
              .finally(() => setLoading(false));
    };

    if (!user) return <div className="alert alert-warn">Connectez-vous pour accéder à votre profil.</div>;

    const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);

    return (
        <div>
            <div className="profile-header">
                <div className="avatar">{initials}</div>
                <div>
                    <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'1.6rem'}}>{user.name}</h2>
                    <p style={{opacity:.8,fontSize:'.9rem'}}>{user.email}</p>
                    <div className="role-badge">{user.role}</div>
                </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem'}}>
                <div style={{background:'var(--white)',borderRadius:'var(--radius)',padding:'1.5rem',boxShadow:'var(--card-shadow)'}}>
                    <h3 style={{marginBottom:'1.25rem',fontFamily:'Playfair Display,serif'}}>Modifier mon profil</h3>
                    {msg && <div className="alert alert-success" style={{marginBottom:'1rem'}}>{msg}</div>}
                    {error && <div className="alert alert-danger" style={{marginBottom:'1rem'}}>{error}</div>}
                    <form onSubmit={save}>
                        <div className="form-group">
                            <label className="form-label">Nom complet</label>
                            <input className="form-control" value={form.name} onChange={e => set('name', e.target.value)} required />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Téléphone</label>
                            <input className="form-control" value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="+33 6 …" />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Bio</label>
                            <textarea className="form-control" rows={3} value={form.bio} onChange={e => set('bio', e.target.value)} placeholder="Quelques mots sur vous…" />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Nouveau mot de passe (laisser vide pour ne pas changer)</label>
                            <input type="password" className="form-control" value={form.password} onChange={e => set('password', e.target.value)} placeholder="••••••••" />
                        </div>
                        <button type="submit" className="btn btn-gold btn-full" disabled={loading}>
                            {loading ? 'Enregistrement…' : '✓ Sauvegarder'}
                        </button>
                    </form>
                </div>

                <div style={{background:'var(--white)',borderRadius:'var(--radius)',padding:'1.5rem',boxShadow:'var(--card-shadow)'}}>
                    <h3 style={{marginBottom:'1rem',fontFamily:'Playfair Display,serif'}}>Informations du compte</h3>
                    <div style={{lineHeight:2.2,color:'var(--text-muted)',fontSize:'.9rem'}}>
                        <div><strong style={{color:'var(--text)'}}>ID :</strong> #{user.id}</div>
                        <div><strong style={{color:'var(--text)'}}>Email :</strong> {user.email}</div>
                        <div><strong style={{color:'var(--text)'}}>Rôle :</strong> <span className="role-badge">{user.role}</span></div>
                        {user.phone && <div><strong style={{color:'var(--text)'}}>Tél. :</strong> {user.phone}</div>}
                        {user.bio   && <div><strong style={{color:'var(--text)'}}>Bio :</strong> {user.bio}</div>}
                        {user.created_at && <div><strong style={{color:'var(--text)'}}>Membre depuis :</strong> {new Date(user.created_at).toLocaleDateString('fr-FR')}</div>}
                    </div>
                </div>
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   ADMIN PANEL
═══════════════════════════════════════════════════════════ */
function AdminView() {
    const { user } = useApp();
    const [section, setSection] = useState('users');
    const [users, setUsers]     = useState([]);
    const [trips, setTrips]     = useState([]);
    const [msg, setMsg]         = useState('');

    // Add destination form
    const [newDest, setNewDest] = useState({ name:'', country:'', description:'', tag:'Culture', price:'', duration_days:'7', image_url:'', continent:'', language:'', currency:'EUR', best_season:'' });

    useEffect(() => {
        if (section === 'users') {
            fetch('api/auth.php?action=list').then(r => r.json()).then(setUsers);
        }
        if (section === 'trips') {
            fetch('api/trips.php?action=all').then(r => r.json()).then(setTrips);
        }
    }, [section]);

    const delUser = (id) => {
        if (id === user.id) { alert('Impossible de se supprimer soi-même.'); return; }
        if (!confirm('Supprimer cet utilisateur ?')) return;
        apiFetch('api/auth.php?action=delete', { method: 'POST', body: JSON.stringify({ id }) })
            .then(d => { setMsg(d.message); setUsers(prev => prev.filter(u => u.id !== id)); });
    };

    const updateRole = (id, role) => {
        apiFetch('api/auth.php?action=update_role', { method: 'POST', body: JSON.stringify({ id, role }) })
            .then(d => { setMsg(d.message); setUsers(prev => prev.map(u => u.id === id ? { ...u, role } : u)); });
    };

    const addDest = (e) => {
        e.preventDefault();
        apiFetch('api/destinations.php', { method: 'POST', body: JSON.stringify({ ...newDest, price: parseInt(newDest.price), duration_days: parseInt(newDest.duration_days), created_by: user.id }) })
            .then(d => {
                if (d.status === 'success') { setMsg('Destination ajoutée !'); setNewDest({ name:'', country:'', description:'', tag:'Culture', price:'', duration_days:'7', image_url:'', continent:'', language:'', currency:'EUR', best_season:'' }); }
                else setMsg(d.message);
            });
    };

    const delDest = (id) => {
        if (!confirm('Supprimer cette destination ?')) return;
        fetch(`api/destinations.php?id=${id}`, { method: 'DELETE' })
            .then(r => r.json()).then(d => setMsg(d.message));
    };

    const delTrip = (trip_id) => {
        if (!confirm('Supprimer cet itinéraire ?')) return;
        apiFetch('api/trips.php', { method: 'POST', body: JSON.stringify({ action: 'delete', trip_id }) })
            .then(d => { setMsg(d.message); setTrips(prev => prev.filter(t => t.id !== trip_id)); });
    };

    if (!user || user.role !== 'admin') return (
        <div className="alert alert-danger">Accès réservé aux administrateurs.</div>
    );

    const navItems = [
        { key: 'users',        label: '👥 Utilisateurs' },
        { key: 'trips',        label: '✈️ Réservations' },
        { key: 'add_dest',     label: '➕ Ajouter destination' },
        { key: 'del_dest',     label: '🗑 Supprimer offre' },
    ];

    return (
        <div>
            <div className="section-head">
                <h2>⚙️ Administration</h2>
                <p>Gestion complète de la plateforme VoyageVista.</p>
            </div>
            {msg && <div className="alert alert-success" style={{marginBottom:'1rem'}}>{msg} <button style={{float:'right',background:'none',border:'none',cursor:'pointer'}} onClick={() => setMsg('')}>✕</button></div>}
            <div className="admin-grid">
                <div className="admin-sidebar">
                    {navItems.map(({ key, label }) => (
                        <div key={key} className={`admin-nav-item ${section === key ? 'active' : ''}`} onClick={() => setSection(key)}>{label}</div>
                    ))}
                </div>

                <div className="admin-content">
                    {/* ── USERS ── */}
                    {section === 'users' && (
                        <div>
                            <h3 style={{marginBottom:'1rem'}}>Gestion des utilisateurs ({users.length})</h3>
                            <div style={{overflowX:'auto'}}>
                                <table className="data-table">
                                    <thead><tr><th>#</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Depuis</th><th>Actions</th></tr></thead>
                                    <tbody>
                                        {users.map(u => (
                                            <tr key={u.id}>
                                                <td>#{u.id}</td>
                                                <td><strong>{u.name}</strong></td>
                                                <td>{u.email}</td>
                                                <td>
                                                    <select className="form-control" style={{padding:'.25rem .5rem',fontSize:'.8rem'}} value={u.role}
                                                        onChange={e => updateRole(u.id, e.target.value)}>
                                                        <option value="client">client</option>
                                                        <option value="prestataire">prestataire</option>
                                                        <option value="admin">admin</option>
                                                    </select>
                                                </td>
                                                <td>{new Date(u.created_at).toLocaleDateString('fr-FR')}</td>
                                                <td>
                                                    {u.id !== user.id && (
                                                        <button className="btn btn-danger btn-sm" onClick={() => delUser(u.id)}>Supprimer</button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* ── TRIPS ── */}
                    {section === 'trips' && (
                        <div>
                            <h3 style={{marginBottom:'1rem'}}>Toutes les réservations ({trips.length})</h3>
                            <div style={{overflowX:'auto'}}>
                                <table className="data-table">
                                    <thead><tr><th>Réf.</th><th>Client</th><th>Destination</th><th>Total</th><th>Statut</th><th>Date</th><th>Action</th></tr></thead>
                                    <tbody>
                                        {trips.map(t => (
                                            <tr key={t.id}>
                                                <td><code style={{fontSize:'.78rem'}}>{t.reference_code}</code></td>
                                                <td>{t.user_name}<br /><span className="text-muted text-sm">{t.user_email}</span></td>
                                                <td>{t.destination_name}</td>
                                                <td><strong>{t.total_price} €</strong></td>
                                                <td><span className={`status-pill status-${t.status}`}>{t.status}</span></td>
                                                <td>{new Date(t.created_at).toLocaleDateString('fr-FR')}</td>
                                                <td><button className="btn btn-danger btn-sm" onClick={() => delTrip(t.id)}>Suppr.</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* ── ADD DESTINATION ── */}
                    {section === 'add_dest' && (
                        <div>
                            <h3 style={{marginBottom:'1.25rem'}}>Ajouter une destination</h3>
                            <form onSubmit={addDest}>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Nom *</label>
                                        <input className="form-control" value={newDest.name} onChange={e => setNewDest(p => ({...p, name: e.target.value}))} required placeholder="Ex: Tokyo" />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Pays *</label>
                                        <input className="form-control" value={newDest.country} onChange={e => setNewDest(p => ({...p, country: e.target.value}))} required placeholder="Ex: Japon" />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Description</label>
                                    <textarea className="form-control" rows={3} value={newDest.description} onChange={e => setNewDest(p => ({...p, description: e.target.value}))} />
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Catégorie</label>
                                        <select className="form-control" value={newDest.tag} onChange={e => setNewDest(p => ({...p, tag: e.target.value}))}>
                                            {['Culture','Romantique','Nature','Aventure','City Break','Autre'].map(t => <option key={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Prix de base (€) *</label>
                                        <input type="number" className="form-control" value={newDest.price} onChange={e => setNewDest(p => ({...p, price: e.target.value}))} required min="0" />
                                    </div>
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Durée (jours)</label>
                                        <input type="number" className="form-control" value={newDest.duration_days} onChange={e => setNewDest(p => ({...p, duration_days: e.target.value}))} min="1" />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Continent</label>
                                        <select className="form-control" value={newDest.continent} onChange={e => setNewDest(p => ({...p, continent: e.target.value}))}>
                                            <option value="">Sélectionner</option>
                                            {['Europe','Asie','Amérique','Afrique','Océanie'].map(c => <option key={c}>{c}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Langue</label>
                                        <input className="form-control" value={newDest.language} onChange={e => setNewDest(p => ({...p, language: e.target.value}))} placeholder="Ex: Japonais" />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Devise</label>
                                        <input className="form-control" value={newDest.currency} onChange={e => setNewDest(p => ({...p, currency: e.target.value}))} placeholder="EUR" />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label className="form-label">URL de l'image</label>
                                    <input className="form-control" value={newDest.image_url} onChange={e => setNewDest(p => ({...p, image_url: e.target.value}))} placeholder="https://images.unsplash.com/…" />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Meilleure saison</label>
                                    <input className="form-control" value={newDest.best_season} onChange={e => setNewDest(p => ({...p, best_season: e.target.value}))} placeholder="Ex: Avril - Octobre" />
                                </div>
                                <button type="submit" className="btn btn-gold">➕ Ajouter la destination</button>
                            </form>
                        </div>
                    )}

                    {/* ── DELETE DESTINATION ── */}
                    {section === 'del_dest' && <AdminDeleteDest onMsg={setMsg} />}
                </div>
            </div>
        </div>
    );
}

function AdminDeleteDest({ onMsg }) {
    const [destinations, setDestinations] = useState([]);

    useEffect(() => {
        fetch('api/destinations.php').then(r => r.json()).then(setDestinations);
    }, []);

    const del = (id) => {
        if (!confirm('Supprimer cette offre touristique ?')) return;
        fetch(`api/destinations.php?id=${id}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(d => { onMsg(d.message); setDestinations(prev => prev.filter(x => x.id !== id)); });
    };

    return (
        <div>
            <h3 style={{marginBottom:'1rem'}}>Supprimer une offre touristique</h3>
            <table className="data-table">
                <thead><tr><th>#</th><th>Destination</th><th>Pays</th><th>Catégorie</th><th>Prix</th><th>Action</th></tr></thead>
                <tbody>
                    {destinations.map(d => (
                        <tr key={d.id}>
                            <td>#{d.id}</td>
                            <td><strong>{d.name}</strong></td>
                            <td>{d.country}</td>
                            <td>{d.tag}</td>
                            <td>{d.price} €</td>
                            <td><button className="btn btn-danger btn-sm" onClick={() => del(d.id)}>Supprimer</button></td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════════ */
function App() {
    const { tab } = useApp();

    return (
        <React.Fragment>
            <Header />
            <main>
                {tab === 'destinations'  && <DestinationsView />}
                {tab === 'transports'    && <TransportsView />}
                {tab === 'accommodations' && <AccommodationsView />}
                {tab === 'activities'    && <ActivitiesView />}
                {tab === 'cart'          && <CartView />}
                {tab === 'trips'         && <TripsView />}
                {tab === 'profile'       && <ProfileView />}
                {tab === 'admin'         && <AdminView />}
            </main>
            <footer>
                <p>© 2026 <strong>VoyageVista</strong> — Plateforme de réservation de voyages · Connecté à MySQL</p>
            </footer>
        </React.Fragment>
    );
}

ReactDOM.render(
    <AppProvider><App /></AppProvider>,
    document.getElementById('root')
);
</script>
