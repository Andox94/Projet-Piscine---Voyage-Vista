<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageVista — Réservation de voyages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
/* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM — VoyageVista
═══════════════════════════════════════════════════════════ */
:root {
    --navy: #0f1b2d;
    --navy-mid: #1a2d47;
    --navy-light: #243752;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --ivory: #f8f5ef;
    --ivory-mid: #ede9e0;
    --text: #1a1a2e;
    --text-muted: #5a6477;
    --white: #ffffff;
    --success: #2d9e6b;
    --danger: #c0392b;
    --warn: #d4830a;
    --card-shadow: 0 2px 16px rgba(15,27,45,0.10);
    --radius: 14px;
    --radius-sm: 8px;
}
[data-theme="dark"] {
    --navy: #0a0f1a;
    --navy-mid: #111927;
    --navy-light: #1c2a3d;
    --ivory: #1e2537;
    --ivory-mid: #252e42;
    --text: #e8eaf0;
    --text-muted: #8a94a8;
    --white: #1c2a3d;
    --card-shadow: 0 2px 16px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--ivory);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}

/* ── HEADER ── */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.3);}
.header-inner{max-width:1300px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:64px;}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--gold);cursor:pointer;white-space:nowrap;letter-spacing:.5px;}
.logo span{color:#fff;font-weight:300;}
.nav-main{display:flex;gap:.25rem;flex:1;justify-content:center;flex-wrap:wrap;}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,.7);padding:.45rem .85rem;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;transition:.2s;white-space:nowrap;}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.1);}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:600;}
.header-actions{display:flex;align-items:center;gap:.5rem;}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative;}
.icon-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:var(--navy);font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;}
.cart-btn{background:var(--gold);color:var(--navy);border:none;padding:.45rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;display:flex;align-items:center;gap:.4rem;transition:.2s;white-space:nowrap;}
.cart-btn:hover{background:var(--gold-light);}
.user-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:.35rem .75rem;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:500;transition:.2s;white-space:nowrap;}
.user-chip:hover{background:rgba(255,255,255,.2);}

/* ── MAIN LAYOUT ── */
main{max-width:1300px;margin:0 auto;padding:2rem 1.5rem;min-height:calc(100vh - 128px);}

/* ── SECTION TITLES ── */
.section-head{margin-bottom:2rem;}
.section-head h2{font-family:'Playfair Display',serif;font-size:2rem;color:var(--navy);margin-bottom:.3rem;}
[data-theme="dark"] .section-head h2{color:var(--gold-light);}
.section-head p{color:var(--text-muted);font-size:.95rem;}

/* ── CARDS GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem;}
.card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);border:2px solid transparent;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;cursor:default;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(15,27,45,.15);}
.card.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.15);}
.card-img{width:100%;height:195px;object-fit:cover;}
.card-body{padding:1.25rem;flex:1;display:flex;flex-direction:column;}
.tag{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.35);padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:600;margin-bottom:.6rem;width:fit-content;text-transform:uppercase;letter-spacing:.5px;}
.card h3{font-size:1.1rem;font-weight:600;margin-bottom:.4rem;line-height:1.3;}
.card-desc{color:var(--text-muted);font-size:.85rem;flex:1;line-height:1.5;margin-bottom:1rem;}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:.85rem;border-top:1px solid var(--ivory-mid);margin-top:auto;}
.price{font-size:1.2rem;font-weight:700;color:var(--navy);}
[data-theme="dark"] .price{color:var(--gold-light);}
.price small{font-size:.7rem;font-weight:400;color:var(--text-muted);}

/* ── BUTTONS ── */
.btn{padding:.5rem 1.1rem;border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:.35rem;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;border:2px solid var(--text-muted);color:var(--text);}
.btn-outline:hover{border-color:var(--navy);color:var(--navy);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.85;}
.btn-sm{padding:.35rem .75rem;font-size:.8rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-full{width:100%;justify-content:center;padding:.75rem;}

/* ── LIST ITEMS (transports) ── */
.list-item{background:var(--white);border:2px solid var(--ivory-mid);border-radius:var(--radius);padding:1.25rem;margin-bottom:.85rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;transition:.2s;}
.list-item:hover{border-color:var(--gold-light);}
.list-item.selected{border-color:var(--gold);background:rgba(201,168,76,.05);}
.list-item h4{font-size:1rem;margin-bottom:.25rem;}
.list-item .meta{color:var(--text-muted);font-size:.8rem;line-height:1.6;}
.avail-badge{font-size:.7rem;padding:.15rem .5rem;border-radius:10px;font-weight:600;}
.avail-high{background:#d4edda;color:#155724;}
.avail-mid{background:#fff3cd;color:#856404;}
.avail-low{background:#f8d7da;color:#721c24;}

/* ── ALERTS ── */
.alert{padding:1rem 1.25rem;border-radius:var(--radius-sm);margin-bottom:1.5rem;font-size:.9rem;}
.alert-warn{background:#fff3cd;color:#856404;border:1px solid #ffeeba;}
.alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
.alert-info{background:rgba(201,168,76,.1);color:var(--navy);border:1px solid rgba(201,168,76,.3);}

/* ── FORMS ── */
.form-group{margin-bottom:1rem;}
.form-label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.35rem;color:var(--text);}
.form-control{width:100%;padding:.7rem .9rem;border:1.5px solid var(--ivory-mid);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:.9rem;background:var(--white);color:var(--text);transition:.2s;}
.form-control:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15);}
select.form-control{cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}

/* ── SEARCH / FILTERS BAR ── */
.search-bar{background:var(--white);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:1.75rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;}
.search-bar .form-group{margin:0;flex:1;min-width:150px;}
.filter-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem;}
.filter-chip{background:var(--ivory-mid);border:1.5px solid transparent;color:var(--text-muted);padding:.35rem .85rem;border-radius:20px;cursor:pointer;font-size:.8rem;font-weight:500;transition:.2s;}
.filter-chip:hover,.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ── CART / CHECKOUT ── */
.cart-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:2rem;}
@media(max-width:820px){.cart-layout{grid-template-columns:1fr;}}
.cart-summary{background:var(--white);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--card-shadow);}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--ivory-mid);font-size:.9rem;}
.cart-row:last-child{border:none;}
.cart-total{font-size:1.4rem;font-weight:700;color:var(--navy);padding-top:.75rem;}
[data-theme="dark"] .cart-total{color:var(--gold-light);}
.checkout-panel{background:var(--white);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--card-shadow);height:fit-content;position:sticky;top:80px;}
.checkout-panel h3{font-family:'Playfair Display',serif;font-size:1.25rem;margin-bottom:1.25rem;}

/* ── PAYMENT CARD ── */
.payment-card-preview{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);border-radius:12px;padding:1.25rem;color:#fff;margin:1rem 0;font-family:monospace;}
.cc-number{font-size:1.1rem;letter-spacing:2px;margin:.5rem 0;}
.cc-meta{display:flex;justify-content:space-between;font-size:.8rem;opacity:.7;margin-top:.5rem;}

/* ── AUTH MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,27,45,.7);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius);padding:2rem;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:1.5rem;color:var(--navy);}
[data-theme="dark"] .modal h2{color:var(--gold-light);}
.modal-close{position:absolute;top:1rem;right:1rem;background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-muted);}
.auth-tabs{display:flex;border-bottom:2px solid var(--ivory-mid);margin-bottom:1.5rem;}
.auth-tab{flex:1;padding:.6rem;border:none;background:transparent;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--text-muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;}
.auth-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── PROFILE ── */
.profile-header{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:var(--radius);padding:2rem;color:#fff;margin-bottom:2rem;display:flex;align-items:center;gap:1.5rem;}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:var(--navy);flex-shrink:0;}
.role-badge{display:inline-block;background:var(--gold);color:var(--navy);padding:.25rem .75rem;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;margin-top:.4rem;}

/* ── NOTIFICATIONS PANEL ── */
.notif-panel{position:fixed;top:64px;right:1rem;width:360px;background:var(--white);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:300;max-height:70vh;overflow-y:auto;animation:slideDown .2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.notif-header{padding:1rem 1.25rem;border-bottom:1px solid var(--ivory-mid);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);}
.notif-item{padding:.85rem 1.25rem;border-bottom:1px solid var(--ivory-mid);display:flex;gap:.75rem;transition:.15s;cursor:pointer;}
.notif-item:hover{background:var(--ivory);}
.notif-item.unread{background:rgba(201,168,76,.07);}
.notif-dot{width:8px;height:8px;background:var(--gold);border-radius:50%;flex-shrink:0;margin-top:6px;}
.notif-dot.read{background:transparent;}
.notif-content p{font-size:.82rem;line-height:1.4;color:var(--text-muted);}
.notif-content strong{font-size:.88rem;color:var(--text);}
.notif-time{font-size:.72rem;color:var(--text-muted);margin-top:.2rem;}

/* ── ADMIN PANEL ── */
.admin-grid{display:grid;grid-template-columns:200px 1fr;gap:2rem;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.admin-sidebar{background:var(--white);border-radius:var(--radius);padding:1rem;box-shadow:var(--card-shadow);height:fit-content;}
.admin-nav-item{padding:.6rem .9rem;border-radius:var(--radius-sm);cursor:pointer;font-size:.88rem;font-weight:500;color:var(--text-muted);transition:.2s;margin-bottom:.2rem;}
.admin-nav-item:hover{background:var(--ivory);}
.admin-nav-item.active{background:var(--navy);color:#fff;}
.admin-content{background:var(--white);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--card-shadow);}
.data-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.data-table th{background:var(--ivory);padding:.7rem 1rem;text-align:left;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);}
.data-table td{padding:.7rem 1rem;border-bottom:1px solid var(--ivory-mid);}
.data-table tr:hover td{background:var(--ivory);}

/* ── TRIPS HISTORY ── */
.trip-card{background:var(--white);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:1rem;display:flex;gap:1.25rem;align-items:flex-start;}
.trip-img{width:90px;height:70px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.status-pill{display:inline-block;padding:.2rem .6rem;border-radius:10px;font-size:.72rem;font-weight:700;text-transform:uppercase;}
.status-confirmed{background:#d4edda;color:#155724;}
.status-cancelled{background:#f8d7da;color:#721c24;}
.status-pending{background:#fff3cd;color:#856404;}

/* ── DESTINATION DETAIL ── */
.dest-hero{border-radius:var(--radius);overflow:hidden;height:300px;position:relative;margin-bottom:2rem;}
.dest-hero img{width:100%;height:100%;object-fit:cover;}
.dest-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,27,45,.8) 0%,transparent 60%);padding:1.5rem;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;}
.stars{color:var(--gold);}

/* ── SUCCESS SCREEN ── */
.success-screen{text-align:center;padding:3rem 1rem;}
.success-icon{font-size:4rem;margin-bottom:1rem;}
.success-screen h2{font-family:'Playfair Display',serif;font-size:2rem;color:var(--navy);margin-bottom:.75rem;}
[data-theme="dark"] .success-screen h2{color:var(--gold-light);}
.ref-code{display:inline-block;background:rgba(201,168,76,.15);border:2px solid var(--gold);padding:.5rem 1.5rem;border-radius:8px;font-family:monospace;font-size:1.3rem;font-weight:700;color:var(--navy);margin:1rem 0;}
[data-theme="dark"] .ref-code{color:var(--gold-light);}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem;color:var(--text-muted);gap:1rem;}
.spinner{width:40px;height:40px;border:3px solid var(--ivory-mid);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MISC ── */
.divider{border:none;border-top:1px solid var(--ivory-mid);margin:1.25rem 0;}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-sm{gap:.5rem;} .gap-md{gap:1rem;}
.text-muted{color:var(--text-muted);}
.text-sm{font-size:.85rem;}
.mt-1{margin-top:.5rem;} .mt-2{margin-top:1rem;}
footer{background:var(--navy);color:rgba(255,255,255,.6);text-align:center;padding:1.5rem;font-size:.85rem;}
footer strong{color:var(--gold);}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .nav-main{display:none;}
  .header-inner{gap:.5rem;}
  .form-row{grid-template-columns:1fr;}
  .notif-panel{width:calc(100vw - 2rem);right:.5rem;}
}
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, createContext, useContext, useRef } = React;

/* ═══════════════════════════════════════════════════════════
   CONTEXT & STATE
═══════════════════════════════════════════════════════════ */
const AppCtx = createContext();

function AppProvider({ children }) {
    // Auth
    const [user, setUser]         = useState(() => {
        try { return JSON.parse(localStorage.getItem('vv_user') || 'null'); } catch { return null; }
    });
    // Cart
    const [cart, setCart]         = useState({
        destination: null, transport: null, accommodation: null, activities: [],
        nights: 3, travelers: 1, departure_date: '', return_date: ''
    });
    // UI
    const [tab, setTab]           = useState('destinations');
    const [darkMode, setDarkMode] = useState(() => localStorage.getItem('vv_dark') === '1');
    const [notifOpen, setNotifOpen] = useState(false);
    const [notifications, setNotifications] = useState([]);

    useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('vv_dark', darkMode ? '1' : '0');
    }, [darkMode]);

    useEffect(() => {
        if (user) { localStorage.setItem('vv_user', JSON.stringify(user)); fetchNotifications(); }
        else localStorage.removeItem('vv_user');
    }, [user]);

    const fetchNotifications = useCallback(() => {
        if (!user) return;
        fetch(`api/notifications.php?user_id=${user.id}`)
            .then(r => r.json()).then(setNotifications).catch(() => {});
    }, [user]);

    const logout = () => {
        setUser(null);
        setCart({ destination: null, transport: null, accommodation: null, activities: [], nights: 3, travelers: 1, departure_date: '', return_date: '' });
        setTab('destinations');
    };

    const selectDestination = (dest) => {
        setCart(prev => ({ ...prev, destination: dest, transport: null, accommodation: null, activities: [] }));
    };

    const toggleActivity = (act) => {
        setCart(prev => {
            const exists = prev.activities.find(a => a.id === act.id);
            if (exists) return { ...prev, activities: prev.activities.filter(a => a.id !== act.id) };
            if (act.is_full || !act.has_enough) return prev;
            return { ...prev, activities: [...prev.activities, act] };
        });
    };

    const cartCount = (cart.destination ? 1 : 0) + (cart.transport ? 1 : 0) + (cart.accommodation ? 1 : 0) + cart.activities.length;
    const unreadCount = notifications.filter(n => !n.is_read).length;

    return (
        <AppCtx.Provider value={{
            user, setUser, logout,
            cart, setCart, selectDestination, toggleActivity, cartCount,
            tab, setTab,
            darkMode, setDarkMode,
            notifOpen, setNotifOpen,
            notifications, setNotifications, fetchNotifications, unreadCount
        }}>
            {children}
        </AppCtx.Provider>
    );
}
const useApp = () => useContext(AppCtx);

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function Stars({ n }) {
    return <span className="stars">{'★'.repeat(Math.round(n))}{'☆'.repeat(5 - Math.round(n))}</span>;
}

function AvailBadge({ left, total }) {
    if (!total) return null;
    const pct = (left / total) * 100;
    const cls = pct > 50 ? 'avail-high' : pct > 20 ? 'avail-mid' : 'avail-low';
    const label = left === 0 ? 'Complet' : left <= 3 ? `${left} restant(s)` : `${left} dispo.`;
    return <span className={`avail-badge ${cls}`}>{label}</span>;
}

function Loading() {
    return <div className="loading"><div className="spinner"></div><p>Chargement…</p></div>;
}

function apiFetch(url, opts = {}) {
    return fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts })
        .then(r => r.json());
}

/* ═══════════════════════════════════════════════════════════
   AUTH MODAL
═══════════════════════════════════════════════════════════ */
function AuthModal({ onClose }) {
    const { setUser, fetchNotifications } = useApp();
    const [mode, setMode]   = useState('login');
    const [form, setForm]   = useState({ name: '', email: '', password: '', phone: '' });
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    const handle = (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        apiFetch(`api/auth.php?action=${mode}`, { method: 'POST', body: JSON.stringify(form) })
            .then(d => {
                if (d.status === 'success') {
                    if (mode === 'login') { setUser(d.user); fetchNotifications(); onClose(); }
                    else { setMode('login'); setError(''); alert('Compte créé ! Connectez-vous.'); }
                } else { setError(d.message); }
            })
            .catch(() => setError('Erreur réseau.'))
            .finally(() => setLoading(false));
    };

    const set = (k, v) => setForm(p => ({ ...p, [k]: v }));

    return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="modal" style={{position:'relative'}}>
                <button className="modal-close" onClick={onClose}>✕</button>
                <h2>🌍 VoyageVista</h2>
                <div className="auth-tabs">
                    <button className={`auth-tab ${mode==='login'?'active':''}`} onClick={() => setMode('login')}>Connexion</button>
                    <button className={`auth-tab ${mode==='register'?'active':''}`} onClick={() => setMode('register')}>Inscription</button>
                </div>
                {error && <div className="alert alert-danger" style={{marginBottom:'1rem'}}>{error}</div>}
                <form onSubmit={handle}>
                    {mode === 'register' && (
                        <div className="form-group">
                            <label className="form-label">Prénom et Nom</label>
                            <input className="form-control" value={form.name} onChange={e => set('name', e.target.value)} required placeholder="Marie Dupont" />
                        </div>
                    )}
                    <div className="form-group">
                        <label className="form-label">Email</label>
                        <input type="email" className="form-control" value={form.email} onChange={e => set('email', e.target.value)} required placeholder="vous@email.com" />
                    </div>
                    <div className="form-group">
                        <label className="form-label">Mot de passe</label>
                        <input type="password" className="form-control" value={form.password} onChange={e => set('password', e.target.value)} required placeholder="••••••••" />
                    </div>
                    {mode === 'register' && (
                        <div className="form-group">
                            <label className="form-label">Téléphone (optionnel)</label>
                            <input className="form-control" value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="+33 6 00 00 00 00" />
                        </div>
                    )}
                    <button type="submit" className="btn btn-gold btn-full" disabled={loading}>
                        {loading ? 'Chargement…' : mode === 'login' ? 'Se connecter' : "Créer mon compte"}
                    </button>
                </form>
                {mode === 'login' && (
                    <p className="text-muted text-sm" style={{marginTop:'1rem',textAlign:'center'}}>
                        Démo — admin@voyagevista.fr / marie@example.com — mot de passe: <strong>password</strong>
                    </p>
                )}
            </div>
        </div>
    );
}

/* ═══════════════════════════════════════════════════════════
   NOTIFICATIONS PANEL
═══════════════════════════════════════════════════════════ */
function NotifPanel() {
    const { user, notifications, setNotifications, fetchNotifications, setNotifOpen } = useApp();
    const unread = notifications.filter(n => !n.is_read).length;

    const markRead = (id) => {
        apiFetch('api/notifications.php', { method: 'POST', body: JSON.stringify({ action: 'mark_read', id, user_id: user.id }) })
            .then(() => {
                setNotifications(prev => prev.map(n => n.id === id ? { ...n, is_read: 1 } : n));
            });
    };

    const markAll = () => {
        apiFetch('api/notifications.php', { method: 'POST', body: JSON.stringify({ action: 'mark_all_read', user_id: user.id }) })
            .then(() => { setNotifications(prev => prev.map(n => ({ ...n, is_read: 1 }))); });
    };

    const del = (id) => {
        apiFetch('api/notifications.php', { method: 'POST', body: JSON.stringify({ action: 'delete', id, user_id: user.id }) })
            .then(() => setNotifications(prev => prev.filter(n => n.id !== id)));
    };

    const typeIcon = { reservation: '✈️', transport: '🚌', hebergement: '🏨', activite: '🎯', promotion: '🏷️', systeme: '⚙️', annulation: '❌', modification: '✏️' };

    const formatDate = (d) => {
        const dt = new Date(d);
        const now = new Date();
        const diff = Math.floor((now - dt) / 1000);
        if (diff < 60) return 'À l\'instant';
        if (diff < 3600) return `Il y a ${Math.floor(diff/60)} min`;
        if (diff < 86400) return `Il y a ${Math.floor(diff/3600)}h`;
        return dt.toLocaleDateString('fr-FR');
    };

    return (
        <div className="notif-panel">
            <div className="notif-header">
                <strong>Notifications {unread > 0 && <span style={{color:'var(--gold)'}}>({unread})</span>}</strong>
                <div style={{display:'flex',gap:'.5rem'}}>
                    {unread > 0 && <button className="btn btn-sm btn-outline" onClick={markAll}>Tout lire</button>}
                    <button className="btn btn-sm btn-outline" onClick={() => setNotifOpen(false)}>✕</button>
                </div>
            </div>
            {notifications.length === 0 ? (
                <div style={{padding:'2rem',textAlign:'center',color:'var(--text-muted)'}}>Aucune notification</div>
            ) : notifications.map(n => (
                <div key={n.id} className={`notif-item ${!n.is_read ? 'unread' : ''}`} onClick={() => markRead(n.id)}>
                    <div className={`notif-dot ${n.is_read ? 'read' : ''}`}></div>
                    <div className="notif-content" style={{flex:1}}>
                        <strong>{typeIcon[n.type] || '📢'} {n.title}</strong>
                        <p>{n.message}</p>
                        <div className="notif-time">{formatDate(n.created_at)}</div>
                    </div>
                    <button className="btn btn-sm" style={{background:'transparent',color:'var(--text-muted)',padding:'.2rem .4rem'}}
                        onClick={e => { e.stopPropagation(); del(n.id); }}>✕</button>
                </div>
            ))}
        </div>
    );
}
