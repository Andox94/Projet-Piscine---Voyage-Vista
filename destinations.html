<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="page-top">

<div id="navbar-placeholder"></div>

<!-- PAGE HEADER -->
<div style="background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 56px 0 48px;">
  <div class="container">
    <p style="font-size: 0.8rem; color: rgba(255,255,255,.5); margin-bottom: 10px;"><a href="index.html" style="color: rgba(255,255,255,.5);">Accueil</a> / Destinations</p>
    <h1 class="heading-1" style="color: var(--white); margin-bottom: 8px;">Explorer les destinations</h1>
    <p style="color: rgba(255,255,255,.65);">120+ destinations sélectionnées par nos experts.</p>
  </div>
</div>

<div id="destinations-app" style="background: var(--sand); padding: 40px 0;"></div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function DestinationsApp() {
  const [destinations, setDestinations] = useState([]);
  const [cartDestId, setCartDestId] = useState(null);
  const [activeCategory, setActiveCategory] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [maxPrice, setMaxPrice] = useState(2000);

  // Chargement des destinations depuis PHP
  useEffect(() => {
    fetch('destinations.php')
      .then(res => res.json())
      .then(data => setDestinations(data))
      .catch(err => console.error('Erreur chargement destinations:', err));

    const cart = Cart.get();
    setCartDestId(cart.destination?.id);
  }, []);

  function handleAddToCart(dest) {
    Cart.setDestination(dest);
    setCartDestId(dest.id);
    Toast.show(`${dest.name} ajouté à votre voyage`, 'success');
  }

  const filtered = destinations.filter(d => {
    if (activeCategory !== 'all' && d.category !== activeCategory) return false;
    if (searchQuery && !d.name.toLowerCase().includes(searchQuery.toLowerCase()) && !d.country.toLowerCase().includes(searchQuery.toLowerCase())) return false;
    if (d.price > maxPrice) return false;
    return true;
  });

  return (
    <div className="container">
      <div className="filter-bar" style={{marginBottom:'28px', flexWrap:'wrap'}}>
        <input type="text" placeholder="🔍 Rechercher une destination..." className="form-input" style={{flex:1, minWidth:'200px'}} value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
        <div className="filter-chips">
          {[
            {key:'all', label:'Toutes'},
            {key:'plage', label:'🏖️ Plage'},
            {key:'culture', label:'🏛️ Culture'},
            {key:'city-break', label:'🏙️ City Break'},
            {key:'nature', label:'🌿 Nature'}
          ].map(cat => (
            <button key={cat.key} className={`chip ${activeCategory === cat.key ? 'active' : ''}`} onClick={() => setActiveCategory(cat.key)}>
              {cat.label}
            </button>
          ))}
        </div>
        <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
          <span>Prix max: {maxPrice} €</span>
          <input type="range" min="200" max="2000" step="50" value={maxPrice} onChange={e => setMaxPrice(parseInt(e.target.value))} style={{accentColor:'var(--terra)'}} />
        </div>
      </div>

      <div style={{marginBottom:'20px'}}>
        <strong>{filtered.length}</strong> destination{filtered.length !== 1 ? 's' : ''} trouvée{filtered.length !== 1 ? 's' : ''}
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state"><div className="empty-state-icon">🔍</div><h3>Aucune destination trouvée</h3><p>Modifiez vos filtres.</p></div>
      ) : (
        <div className="dest-grid">
          {filtered.map(dest => (
            <div className="card" key={dest.id}>
              <div className="card-img card-img-tall">
                <img src={dest.image_url} alt={dest.name} loading="lazy" />
                <button className="card-wishlist">🤍</button>
              </div>
              <div className="card-body">
                <span className="card-tag">{dest.tag || 'Destination'}</span>
                <h3 className="card-title">{dest.name}, {dest.country || 'Pays'}</h3>
                <p className="card-desc">{dest.description}</p>
              </div>
              <div className="card-footer">
                <div>
                  <div className="card-price">Dès {dest.price} € <span>/ pers.</span></div>
                  <div className="card-rating">⭐ {dest.rating || '4.5'} · {dest.reviews || 0} avis</div>
                </div>
                <div style={{display:'flex', gap:'8px'}}>
                  <a href={`destination-detail.html?id=${dest.id}`} className="btn btn-ghost btn-sm">Détails</a>
                  <button className={`btn btn-sm ${cartDestId === dest.id ? 'btn-gold' : 'btn-secondary'}`} onClick={() => handleAddToCart(dest)}>
                    {cartDestId === dest.id ? '✓ Sélectionné' : 'Choisir'}
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<DestinationsApp />, document.getElementById('destinations-app'));
</script>
</body>
</html>
