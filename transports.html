<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transports — VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="page-top">

<div id="navbar-placeholder"></div>

<div style="background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 40px 0 36px;">
  <div class="container" style="color: var(--white);">
    <p style="font-size: 0.8rem; color: rgba(255,255,255,.5); margin-bottom: 10px;"><a href="destinations.html" style="color: rgba(255,255,255,.5);">← Destinations</a></p>
    <h1 class="heading-1" style="color: var(--white);">Choisissez votre transport</h1>
  </div>
</div>

<div style="background: var(--sand); padding: 36px 0;">
  <div class="container">
    <!-- Barre d'étapes -->
    <div class="steps-bar" style="margin-bottom: 32px;">
      <div class="step done"><div class="step-num">✓</div><div class="step-info"><div class="step-label">Étape 1</div><div class="step-name">Destination</div></div></div>
      <div class="step active"><div class="step-num">2</div><div class="step-info"><div class="step-label">Étape 2</div><div class="step-name">Transport</div></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-info"><div class="step-label">Étape 3</div><div class="step-name">Hébergement</div></div></div>
      <div class="step"><div class="step-num">4</div><div class="step-info"><div class="step-label">Étape 4</div><div class="step-name">Activités</div></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-info"><div class="step-label">Étape 5</div><div class="step-name">Panier</div></div></div>
    </div>

    <div id="transports-app"></div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function TransportsApp() {
  const [cart, setCart] = useState(null);
  const [transports, setTransports] = useState([]);
  const [selectedTransport, setSelectedTransport] = useState(null);
  const [typeFilter, setTypeFilter] = useState('all');

  useEffect(() => {
    const c = Cart.get();
    setCart(c);
    if (c.transport) setSelectedTransport(c.transport);
    if (c.destination) {
      fetch(`transports.php?dest_id=${c.destination.id}`)
        .then(res => res.json())
        .then(data => setTransports(data))
        .catch(err => console.error(err));
    }
  }, []);

  function handleSelect(t) {
    Cart.setTransport(t);
    setSelectedTransport(t);
    Toast.show('Transport sélectionné', 'success');
    // Mettre à jour le badge du panier (main.js le fait déjà via updateBadge)
    Cart.updateBadge();
  }

  if (!cart?.destination) {
    return (
      <div className="empty-state">
        <div className="empty-state-icon">🗺️</div>
        <h3>Aucune destination sélectionnée</h3>
        <p>Commencez par choisir une destination.</p>
        <a href="destinations.html" className="btn btn-primary" style={{marginTop:'16px'}}>Explorer les destinations</a>
      </div>
    );
  }

  const filtered = transports.filter(t => typeFilter === 'all' || t.type.toLowerCase().includes(typeFilter));

  return (
    <div style={{display:'grid', gridTemplateColumns:'1fr 340px', gap:'32px', alignItems:'start'}}>
      <div>
        <div style={{background:'var(--white)', borderRadius:'var(--radius-lg)', padding:'16px 20px', marginBottom:'20px'}}>
          <span style={{fontSize:'1.3rem'}}>📍</span>
          <div><div style={{fontSize:'0.75rem', color:'var(--text-light)'}}>Destination sélectionnée</div>
          <div style={{fontWeight:700}}>{cart.destination.name}, {cart.destination.country}</div></div>
        </div>

        <div className="filter-bar" style={{marginBottom:'20px', padding:'14px 20px'}}>
          <span style={{fontWeight:700}}>Type :</span>
          <div className="filter-chips">
            {[['all','Tous'],['vol','Avion'],['tgv','Train'],['bus','Bus']].map(([k,l]) => (
              <button key={k} className={`chip ${typeFilter===k?'active':''}`} onClick={()=>setTypeFilter(k)}>{l}</button>
            ))}
          </div>
        </div>

        {filtered.map(t => (
          <div key={t.id} className={`transport-card ${selectedTransport?.id === t.id ? 'selected' : ''}`} onClick={() => handleSelect(t)}>
            <div className="transport-icon">{t.icon || '✈️'}</div>
            <div className="transport-route" style={{flex:1}}>
              <div className="transport-times">
                <span className="transport-time">{t.dep_time || '--:--'}</span>
                <span className="transport-arrow">——→</span>
                <span className="transport-time">{t.arr_time || '--:--'}</span>
              </div>
              <div className="transport-duration">{t.duration || '?'} · {t.company || t.type}</div>
              <div><span className="transport-detail-tag">{t.type}</span> <span className="transport-detail-tag">{t.class || 'Standard'}</span></div>
            </div>
            <div className="transport-price-section">
              <div className="transport-price">{t.price} €</div>
              <div className={`transport-seats ${t.seats_left <= 5 ? 'low' : ''}`}>
                {t.seats_left <= 5 ? `⚠️ ${t.seats_left} places restantes` : `${t.seats_left} places disponibles`}
              </div>
            </div>
            <div className="transport-select-btn">{selectedTransport?.id === t.id ? '✓' : '+'}</div>
          </div>
        ))}
      </div>

      <div style={{position:'sticky', top:'88px'}}>
        <div className="order-summary">
          <h3 className="summary-title">Récapitulatif</h3>
          <div className="summary-line"><span>📍 {cart.destination.name}</span><strong>{cart.destination.price} €</strong></div>
          {selectedTransport ? (
            <div className="summary-line"><span>{selectedTransport.icon} {selectedTransport.type}</span><strong>{selectedTransport.price} €</strong></div>
          ) : (
            <div className="summary-line" style={{fontStyle:'italic'}}><span>Transport non sélectionné</span><strong>—</strong></div>
          )}
          <div className="summary-divider"></div>
          <div className="summary-total">
            <span>Total provisoire</span>
            <span className="price">{(cart.destination.price || 0) + (selectedTransport?.price || 0)} €</span>
          </div>
          <a href="hebergements.html" className={`checkout-btn ${!selectedTransport ? 'disabled' : ''}`} style={!selectedTransport ? {opacity:0.5, pointerEvents:'none'} : {}}>
            Continuer : Hébergements →
          </a>
          {!selectedTransport && <p style={{textAlign:'center', fontSize:'0.78rem', marginTop:'10px'}}>Sélectionnez un transport pour continuer</p>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<TransportsApp />, document.getElementById('transports-app'));
</script>
</body>
</html>
